<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教室座位自動排位</title>
<style>
:root{--ink:#16181d;--line:#222;--muted:#6b7280;--accent:#2b6cb0;--bg:#f4f4f2;--bd:#d6d6d6;--danger:#b00020}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}
button{font-size:14px;padding:7px 12px;border-radius:8px;border:1px solid #c9c9c9;background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
button:hover{background:#f1f5fa}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.dng{color:var(--danger);border-color:#e3a3ad}
button.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
button:disabled{opacity:.4;cursor:default}
button.big{font-size:30px;padding:16px 56px;border-radius:18px;font-weight:700}
button.sm{padding:3px 8px;font-size:13px}
input[type=text],input[type=password],input[type=number],select,textarea{border:1px solid #c9c9c9;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink);max-width:100%}
a.back{color:var(--accent);text-decoration:none;padding:7px 8px;font-size:14px}
.top{background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.top h1{font-size:18px;margin:0 10px 0 0}
.sp{flex:1}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;background:#e11d48;color:#fff;border-radius:10px;font-size:12px;padding:0 7px;margin-left:6px}

/* home */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:12px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:22px}
.card .meta{font-size:13px;color:var(--muted);line-height:1.6}
.empty-home{padding:40px;text-align:center;color:var(--muted)}

/* stage */
.wrap{padding:8px}
.scaler{position:relative;margin:0 auto}
.stage{position:absolute;left:0;top:0;width:1400px;height:1050px;background:#fff;transform-origin:0 0;box-shadow:0 1px 6px rgba(0,0,0,.12);overflow:hidden;user-select:none;-webkit-user-select:none}
.room{position:absolute;left:20px;top:20px;width:1360px;height:1010px;border:1.5px solid #999;pointer-events:none}
.grp{position:absolute;width:0;height:0}
.box{position:absolute;border:2px solid var(--line)}
.canedit .box{cursor:grab;touch-action:none}
.canedit .box:hover{background:#f3f8ff}
.box.round{border-radius:50%}
.box.fx{display:flex;align-items:center;justify-content:center}
.box.k-wall{border:none}
.box.k-text{border-color:transparent}
.canedit .box.k-text{border:1px dashed #ddd}
.grp.sel>.box{outline:4px solid var(--accent);outline-offset:3px;background:#eef5ff}
.t{position:absolute;white-space:nowrap;outline:none;border-radius:4px;padding:1px 4px;line-height:1.2;min-width:1em;min-height:1em}
.fx .t{position:static}
.t[contenteditable=true]{cursor:text;touch-action:manipulation}
.t[contenteditable=true]:hover{background:#fff7d6}
.t[contenteditable=true]:focus{background:#fff1b0;box-shadow:0 0 0 2px #e0b400}
.ac{transform:translate(-50%,-50%);text-align:center}
.al{transform:translate(0,-50%);text-align:left}
.rz{position:absolute;width:26px;height:26px;background:var(--accent);border:3px solid #fff;border-radius:6px;cursor:nwse-resize;touch-action:none;z-index:3}
.marq{position:absolute;border:1.5px dashed var(--accent);background:rgba(43,108,176,.12);pointer-events:none;z-index:9}
.chip{position:absolute;width:120px;height:58px;border:1px solid #dcdcdc;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;overflow:hidden}
.chip .nm{font-size:26px;font-weight:500;white-space:nowrap}
.chip .nm:empty::before{content:"空位";color:#c8c8c8;font-size:20px}
.chip .nm .no{font-size:15px;color:#888;font-weight:400;margin-right:6px}
.chip .nt{font-size:14px;color:#666;white-space:nowrap}
.chip .lock{position:absolute;right:3px;top:1px;font-size:12px}
.chip.tpl{background:#fafafa;border-style:dashed}
.chip.tpl .nm{color:#9aa0a6;font-size:20px}
.admin .chip{cursor:grab;touch-action:none}
.admin .chip:hover{background:#f3f8ff}
.chip.bad{border-color:#d33;background:#fff0f0}
.chip.dropt{outline:3px solid var(--accent)}
.chip.pop{animation:pop .55s ease-out}
@keyframes pop{0%{transform:scale(.55);opacity:.2}55%{transform:scale(1.18);opacity:1}80%{transform:scale(.96)}100%{transform:scale(1)}}
.ghost{position:fixed;z-index:200;pointer-events:none;background:#fff;border:2px solid var(--accent);border-radius:10px;padding:6px 14px;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);transform:translate(-50%,-50%)}

/* selection bar */
.selbar{display:none;position:sticky;top:0;z-index:15;background:#fffbe6;border-bottom:1px solid #e6d98a;padding:6px 12px;gap:6px;flex-wrap:wrap;align-items:center}
.selbar.show{display:flex}
.stp{display:inline-flex;gap:4px;align-items:center;background:#fff;border:1px solid #ddd;border-radius:8px;padding:2px 6px}
.stp button{padding:1px 8px}

/* template editor */
.edgrid{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px;padding:8px}
.palette{position:sticky;top:44px;align-self:start;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.palette h4{margin:0 0 2px;font-size:13px;color:var(--muted)}
.palette button{text-align:left;touch-action:none;user-select:none;-webkit-user-select:none}
.palbtn{display:none}
@media(max-width:800px){
  .edgrid{display:block;padding:4px}
  .palette{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:14px 14px 0 0;display:none;flex-direction:row;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(0,0,0,.2);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .palette.open{display:flex}
  .palette h4{width:100%}
  .palbtn{display:block;position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:41;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  body.tplpage{padding-bottom:70px}
}

/* class page */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:10px;padding:8px;align-items:start}
@media(max-width:1050px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:#fff;border:1px solid #ddd;border-radius:10px;padding:6px 12px}
.panel details{border-top:1px solid #eee;padding:2px 0}
.panel details:first-child{border-top:none}
.panel summary{cursor:pointer;font-weight:600;padding:8px 0}
.panel .body{padding:0 0 10px;display:flex;flex-direction:column;gap:8px}
.alert{background:#fff4c2;border:1px solid #e6d070;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.5}
.alert.bad{background:#ffe4e4;border-color:#e3a3a3}
.ok{background:#e6f6e6;border:1px solid #9fd29f;border-radius:8px;padding:6px 10px;font-size:13px}
table.lst{border-collapse:collapse;width:100%}
table.lst td,table.lst th{border-bottom:1px solid #eee;padding:2px 3px;text-align:left;font-size:13px}
table.lst input,table.lst select{width:100%;padding:4px 5px}
.stu .ctrl{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 12px 14px}
.prog{width:min(92%,760px);height:16px;background:#e3e3e3;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.shuf{font-size:28px;font-weight:700}
.unseated{display:flex;flex-wrap:wrap;gap:6px}
.unseated span{background:#eef2f7;border:1px solid #cdd6e2;border-radius:14px;padding:3px 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.trialbar{background:#e8f1fb;border:1px solid #9cc0e6;border-radius:8px;padding:8px 10px}
body.fs .backlink{display:none}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.mcard{background:#fff;border-radius:12px;padding:16px;max-width:96vw;max-height:94vh;overflow:auto;min-width:min(92vw,360px)}
.mcard.wide{width:min(96vw,880px)}
.mcard h3{margin:0 0 8px}
.mcard p{margin:8px 0}
.mcard img{max-width:100%;height:auto;border:1px solid #ddd}
.drop{border:2px dashed #aab;border-radius:10px;padding:10px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{background:#e8f1fb;border-color:var(--accent)}
.pt{border-collapse:collapse;width:100%}
.pt td,.pt th{border:1px solid #ddd;padding:0;font-size:13px}
.pt th{background:#f3f3f3;padding:4px}
.pt input,.pt select{width:100%;border:none;border-radius:0;padding:6px;background:transparent}
.pt tr.unc td{background:#fff6c8}
.pt tr.dup td.nmc input{color:#c00;font-weight:700}
.tblscroll{max-height:42vh;overflow:auto;border:1px solid #ddd}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:10px 16px;z-index:300;font-size:14px;max-width:90vw}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= 基本工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') { if (tag !== 'select') e.value = v; }
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  if (tag === 'select' && props && 'value' in props) e.value = props.value;
  return e;
}
const uid = () => 'i' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const clone = o => JSON.parse(JSON.stringify(o));
const rnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const snapG = v => Math.round(v / 10) * 10;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; }

function modal(content, opts = {}) {
  const card = h('div', { class: 'mcard' + (opts.wide ? ' wide' : '') }, content);
  const bg = h('div', { class: 'mbg' }, card);
  const api = { el: bg, card, close() { if (bg.parentNode) { bg.remove(); opts.onClose && opts.onClose(); } } };
  if (!opts.sticky) bg.addEventListener('pointerdown', e => { if (e.target === bg) api.close(); });
  document.body.append(bg);
  return api;
}
function askText(title, def = '', okLabel = '確定') {
  return new Promise(res => {
    const inp = h('input', { type: 'text', value: def, style: { width: '100%' } });
    let m;
    const done = v => { res(v); m.close(); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(inp.value.trim()); });
    m = modal(h('div', null, h('p', null, title), inp,
      h('p', { class: 'row' }, h('button', { class: 'pri', onClick: () => done(inp.value.trim()) }, okLabel), h('button', { onClick: () => done(null) }, '取消'))),
      { onClose: () => res(null) });
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
  });
}
let _toastT;
function toast(msg, ms = 2800) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const t = h('div', { class: 'toast' }, msg); document.body.append(t);
  clearTimeout(_toastT); _toastT = setTimeout(() => t.remove(), ms);
}
function confirmBtn(label, confirmLabel, fn, cls = '') {
  const b = h('button', { class: 'dng ' + cls }, label);
  let armed = false, t;
  b.addEventListener('click', () => {
    if (!armed) { armed = true; b.textContent = confirmLabel; b.classList.add('armed'); t = setTimeout(() => { armed = false; b.textContent = label; b.classList.remove('armed'); }, 3000); }
    else { clearTimeout(t); armed = false; fn(); }
  });
  return b;
}
function download(name, blob) {
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const fmtTime = t => t ? new Date(t).toLocaleString('zh-TW', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '尚未排位';

/* ================= 預設資料（來自原本的 402/501/605） ================= */
const N = (name, note) => note ? { name, note } : { name };
const DEFAULTS = {
  "402": {
    title: "402 座位表（全直桌）", wall: "牆", desk: "老師講桌", podium: "講台（402）",
    tables: [
      { label: "2", left: [], right: [] },
      { label: "3", left: [], right: [] },
      { label: "4", left: [], right: [] },
      { label: "1", left: [], right: [] },
      { label: "5", left: [], right: [] },
    ]
  },
  "501": {
    title: "501 座位表（全直桌）", wall: "牆", desk: "老師講桌", podium: "講台（501）",
    tables: [
      { label: "2", left: [], right: [] },
      { label: "3", left: [], right: [] },
      { label: "4", left: [], right: [] },
      { label: "1", left: [], right: [] },
      { label: "5", left: [], right: [] },
    ]
  },
  "605": {
    title: "605 座位表（全直桌）", wall: "牆", desk: "老師講桌", podium: "講台（605）",
    tables: [
      { label: "2", left: [], right: [] },
      { label: "3", left: [], right: [] },
      { label: "4", left: [], right: [] },
      { label: "1", left: [], right: [] },
      { label: "5", left: [], right: [] },
    ]
  }
};
function pad3(arr) {
  arr = (arr || []).map(p => ({ ...p }));
  const E = () => ({ name: '' });
  if (arr.length >= 3) return arr.slice(0, 3);
  if (arr.length === 2) return [arr[0], E(), arr[1]];
  if (arr.length === 1) return [E(), arr[0], E()];
  return [E(), E(), E()];
}
function artLayout() {
  const mk = (label, x, y) => ({ id: 'a' + label, type: 'long', x, y, orient: 'v', nL: 3, nR: 3, label });
  return {
    title: '座位表', objs: [
      { id: 'wall', type: 'fx', kind: 'wall', x: 25, y: 525, w: 10, h: 1010, text: '', fill: '#555', size: 20 },
      { id: 'walltxt', type: 'fx', kind: 'text', x: 62, y: 530, w: 60, h: 40, text: '牆', fill: '', size: 22 },
      mk('2', 220, 290), mk('3', 700, 290), mk('4', 1150, 290), mk('1', 220, 690), mk('5', 1150, 690),
      { id: 'desk', type: 'fx', kind: 'desk', x: 320, y: 965, w: 200, h: 70, text: '老師講桌', fill: '#F1E6C8', size: 26 },
      { id: 'podium', type: 'fx', kind: 'podium', x: 700, y: 965, w: 440, h: 70, text: '講台', fill: '', size: 30 },
    ]
  };
}
const FX = {
  desk: { name: '講桌', w: 200, h: 70, text: '老師講桌', fill: '#F1E6C8', size: 26 },
  podium: { name: '講台', w: 440, h: 70, text: '講台', fill: '', size: 30 },
  door: { name: '門', w: 100, h: 30, text: '門', fill: '#cfe8cf', size: 18 },
  window: { name: '窗', w: 160, h: 24, text: '窗', fill: '#d6ebff', size: 16 },
  cabinet: { name: '櫃子', w: 160, h: 56, text: '櫃子', fill: '#e6e0f0', size: 22 },
  wall: { name: '牆', w: 12, h: 300, text: '', fill: '#555', size: 20 },
  text: { name: '文字標籤', w: 140, h: 44, text: '文字', fill: '', size: 28 },
};

/* ================= 資料存取 ================= */
const KEY = 'seatplan-v2';
let DB = null;
const defSettings = () => ({ adjDist: 120, nearDist: 450, empty: 'spread', balance: false, keep: false });
function mkClass(o) {
  return Object.assign({
    id: 'c' + uid(), name: '新班級', templateId: 'tpl-art', templateName: '藝術教室', layout: { title: '座位表', objs: [] },
    students: [], assign: {}, pins: {}, rules: [], settings: defSettings(), history: [], lostPins: [], lastArranged: null, created: Date.now()
  }, o);
}
function normClass(c) {
  c.students = (c.students || []).map(s => ({ id: s.id || uid(), no: s.no == null ? '' : String(s.no), name: s.name || '', gender: s.gender || '', note: s.note || '' }));
  c.assign = c.assign || {}; c.pins = c.pins || {}; c.rules = c.rules || []; c.history = c.history || []; c.lostPins = c.lostPins || [];
  c.settings = Object.assign(defSettings(), c.settings || {});
  c.layout = c.layout || { title: '座位表', objs: [] };
  c.layout.objs = c.layout.objs || [];
  return c;
}
function seed() {
  const art = { id: 'tpl-art', name: '藝術教室', builtin: true, layout: artLayout() };
  const classes = [];
  Object.keys(DEFAULTS).forEach(key => {
    const d = DEFAULTS[key], layout = artLayout();
    layout.title = d.title;
    layout.objs.forEach(o => { if (o.id === 'desk') o.text = d.desk; if (o.id === 'podium') o.text = d.podium; if (o.id === 'walltxt') o.text = d.wall; });
    const students = [], assign = {};
    d.tables.slice().sort((a, b) => String(a.label).localeCompare(String(b.label))).forEach(t => {
      ['left', 'right'].forEach((side, si) => {
        pad3(t[side]).forEach((p, i) => {
          if (!p.name) return;
          const s = { id: uid(), no: '', name: p.name, gender: '', note: p.note || '' };
          students.push(s); assign['a' + t.label + ':' + (si * 3 + i + 1)] = s.id;
        });
      });
    });
    classes.push(mkClass({ id: 'c' + key, name: key, templateId: 'tpl-art', templateName: '藝術教室', layout, students, assign }));
  });
  return { v: 2, settings: { pw: '0000', anim: 4, sound: true }, templates: [art], classes, ui: {} };
}
function load() {
  try { DB = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { DB = null; }
  if (!DB || DB.v !== 2 || !Array.isArray(DB.classes) || !Array.isArray(DB.templates)) DB = seed();
  DB.settings = Object.assign({ pw: '0000', anim: 4, sound: true }, DB.settings || {});
  DB.ui = DB.ui || {};
  if (!DB.templates.length) DB.templates.push({ id: 'tpl-art', name: '藝術教室', builtin: true, layout: artLayout() });
  DB.classes.forEach(normClass);
  save();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { } }
function sortRoster(arr) {
  const hasNo = s => s.no !== '' && s.no != null && !isNaN(parseInt(s.no, 10));
  return arr.map((s, i) => ({ s, i })).sort((a, b) => {
    const ha = hasNo(a.s), hb = hasNo(b.s);
    if (ha && hb) { const d = parseInt(a.s.no, 10) - parseInt(b.s.no, 10); return d || a.i - b.i; }
    if (ha !== hb) return ha ? -1 : 1;
    return a.i - b.i;
  }).map(x => x.s);
}

/* ================= 幾何 ================= */
const CW = 120, CH = 58;
function tableInfo(o) {
  const seats = []; let w, hh, slot = 90;
  if (o.type === 'long') {
    const nL = o.nL, nR = o.nR, m = Math.max(2, nL, nR), mx = Math.max(1, nL, nR);
    if (o.orient === 'h') {
      const Ln = m * 144; w = Ln; hh = 130; slot = Ln / mx;
      for (let i = 0; i < nL; i++) seats.push({ side: 'a', i, n: nL, x: -Ln / 2 + Ln * (i + .5) / nL, y: -106 });
      for (let i = 0; i < nR; i++) seats.push({ side: 'b', i, n: nR, x: -Ln / 2 + Ln * (i + .5) / nR, y: 106 });
    } else {
      const Ln = m * 90; w = 130; hh = Ln; slot = Ln / mx;
      for (let i = 0; i < nL; i++) seats.push({ side: 'a', i, n: nL, x: -135, y: -Ln / 2 + Ln * (i + .5) / nL });

const MAMMOTH_URL = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';

const _ld = {};
function loadLib(url, test) {
  if (test()) return Promise.resolve();
  if (_ld[url]) return _ld[url];
  return _ld[url] = new Promise((ok, no) => {
    const s = document.createElement('script'); s.src = url; s.crossOrigin = 'anonymous';
    s.onload = () => test() ? ok() : no(new Error('load'));
    s.onerror = () => { delete _ld[url]; no(new Error('load')); };

}
async function docxToRows(buf) {
  await loadLib(MAMMOTH_URL, () => window.mammoth);
  const r = await window.mammoth.convertToHtml({ arrayBuffer: buf });
  const doc = new DOMParser().parseFromString(r.value, 'text/html');
  doc.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
  const rows = [];
  [...doc.body.children].forEach(n => {
    const tg = n.tagName;
    if (tg === 'TABLE') n.querySelectorAll('tr').forEach(tr => rows.push([...tr.children].map(c => c.textContent.trim())));
    else if (tg === 'UL' || tg === 'OL') [...n.children].forEach(li => rows.push(...textToRows(li.textContent)));

}

const GD = { token: null, exp: 0 };

async function gdSignIn() {

  try { await gdLoadGIS(); } catch (e) { toast(e.message); return false; }
  return new Promise(res => {
    const tc = google.accounts.oauth2.initTokenClient({

async function gdFolder() {
  const H = { Authorization: 'Bearer ' + GD.token };
  if (DB.settings.gFolder) {
    const r = await fetch('https://www.googleapis.com/drive/v3/files/' + DB.settings.gFolder + '?fields=id,trashed', { headers: H });
    if (r.ok && !(await r.json()).trashed) return DB.settings.gFolder;
  }
  const q = encodeURIComponent("name='座位表' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const f = await (await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)', { headers: H })).json();
  let id = f.files && f.files[0] && f.files[0].id;
  if (!id) {
    const c = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: '座位表', mimeType: 'application/vnd.google-apps.folder' }) });

  if (!(await ready)) return;
  try {
    const folder = await gdFolder();
    const fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify({ name, parents: [folder] })], { type: 'application/json' }));
    fd.append('file', blob);

  } catch (e) { toast('同步到 Google 雲端失敗：' + e.message, 5000); }

  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq; g.gain.value = vol; o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur); o.stop(AC.currentTime + dur);
  } catch (e) { }
}

function startShuffle() {
  if (CV.anim) return;
  const cls = CV.cls, token = CV.token;
  CV.anim = true;
  const res = arrange(cls);               // 按下的瞬間就算好

  CV.ctrl.innerHTML = ''; CV.ctrl.append(h('button', { class: 'big pri', disabled: true }, '自由排位'));
  runShuffle(cls, res, bar, token).then(ok => {
    if (!ok || !CV || CV.token !== token) return;
    cls.assign = res.assign; pushHistory(cls, res); cls.lastArranged = Date.now(); save();
    CV.anim = false;
    beep(660, .15, .08); setTimeout(() => beep(880, .25, .08), 140);
    drawClass();

function runShuffle(cls, res, bar, token) {
  return new Promise(resolve => {
    const D = DB.settings.anim * 1000, T1 = D * 0.68;
    const ids = Object.keys(ES.chips), names = cls.students.map(s => s.name);
    ids.forEach(id => { const ch = ES.chips[id]; if (ch.nt) { ch.nt.remove(); ch.nt = null; } });
    const order = shuffle(ids.slice()), settleAt = {}, st = {};
    order.forEach((id, i) => { settleAt[id] = T1 + (i / Math.max(1, order.length)) * D * 0.28; st[id] = { next: 0, done: false }; });
    const t0 = performance.now(); let lastTick = 0, lastDing = 0;
    const settle = id => {
      const ch = ES.chips[id], s = st[id]; s.done = true;
      const stu = res.assign[id] ? stuById(cls, res.assign[id]) : null;
      setName(ch.nm, stu ? stu.name : '', stu ? stu.no : '');
      if (stu && stu.note) { ch.c.append(h('div', { class: 'nt' }, stu.note)); }
      ch.c.classList.add('pop');
    };
    const frame = now => {
      if (!CV || CV.token !== token) { resolve(false); return; }
      const e = now - t0; bar.style.width = Math.min(100, e / D * 100) + '%';
      let changedAny = false, dinged = false;
      for (const id of ids) {
        const s = st[id]; if (s.done) continue;
        if (e >= settleAt[id]) { settle(id); dinged = true; continue; }
        if (e >= s.next) { { const rs = cls.students[rnd(cls.students.length)]; setName(ES.chips[id].nm, rs ? rs.name : '', rs ? rs.no : ''); } s.next = e + 40 + 430 * Math.pow(Math.min(1, e / T1), 2) + rnd(30); changedAny = true; }
      }
      if (changedAny && now - lastTick > 90) { beep(300 + 500 * Math.min(1, e / T1), .04, .03); lastTick = now; }
      if (dinged && now - lastDing > 70) { beep(900, .08, .05); lastDing = now; }
      if (e >= D) { ids.forEach(id => { if (!st[id].done) settle(id); }); setTimeout(() => resolve(true), 350); return; }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}

function startChipDrag(ev, seatId) {
  if (ev.button > 0 || ES.preview) return;
  ev.preventDefault(); ev.stopPropagation();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const cls = ES.cls, stu = cls.assign[seatId] ? stuById(cls, cls.assign[seatId]) : null;
  const sx = ev.clientX, sy = ev.clientY; let moved = false, ghost = null, hov = null;
  const chipAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.chip') : null; };
  const mv = e => {
    if (!moved) { if (!stu || Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return; moved = true; ghost = h('div', { class: 'ghost' }, stu.name); document.body.append(ghost); }
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    const c = chipAt(e.clientX, e.clientY);
    if (hov && hov !== c) hov.classList.remove('dropt');
    if (c && c.dataset.seat) c.classList.add('dropt');
    hov = c;
  };
  const up = e => {
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    if (hov) hov.classList.remove('dropt'); if (ghost) ghost.remove();
    if (!moved) { openSeatDialog(seatId); return; }
    const c = chipAt(e.clientX, e.clientY);
    if (c && c.dataset.seat && c.dataset.seat !== seatId) placeStudent(stu.id, c.dataset.seat);
  };

    h('div', { style: { margin: '6px 0' } }, 'Google Client ID：', gid),
    h('label', null, gon, ' 登入 Google 並啟用同步　'), gst));
  body.append(h('div', { class: 'row' }, h('button', { onClick: () => backupModal(cls) }, '匯出／匯入設定（JSON）')));
  return sec('set', '版面與設定', body);
}

/* ================= 啟動 ================= */
['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));
load();
route();

</script>
